server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers (static SPA)
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Permissions-Policy "interest-cohort=()" always;
    # CSP: self assets + Google fonts used by index.html; API same-origin via /api proxy
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    # SPA + static
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed assets; no cache for HTML
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Proxy API to rgs-api service (docker network)
    location /api/ {
        proxy_pass http://rgs-api:3000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /health {
        proxy_pass http://rgs-api:3000/health;
    }

    location /ready {
        proxy_pass http://rgs-api:3000/ready;
    }

    location /openapi.json {
        proxy_pass http://rgs-api:3000/openapi.json;
    }

    location /version {
        proxy_pass http://rgs-api:3000/version;
    }

    # Ops console is static admin.html; API via /api proxy
    location = /admin {
        return 302 /admin.html;
    }
}
