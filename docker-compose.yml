# Western Stampede — Portainer / local Docker stack
# Place at repo root so Portainer Git deploy finds it by default.
# Stack → Repository → Branch: main → Compose path: docker-compose.yml (or leave default)

services:
  rgs-api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.rgs
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      RNG_PROVIDER: ${RNG_PROVIDER:-local}
      TOPUP_MODE: ${TOPUP_MODE:-demo}
      GUEST_START_BALANCE: ${GUEST_START_BALANCE:-10000}
      REAL_MONEY: ${REAL_MONEY:-false}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-dev-admin-token}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
    ports:
      - "3000:3000"
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  client:
    build:
      context: .
      dockerfile: deploy/Dockerfile.client
      args:
        VITE_API_URL: ${VITE_API_URL:-}
    ports:
      - "8080:80"
    depends_on:
      rgs-api:
        condition: service_healthy
    restart: unless-stopped
