name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

jobs:
  lab-50m:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LAB_SIGNING_KEY: ${{ secrets.LAB_SIGNING_KEY || 'ci-lab-signing-key-not-for-production!' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - name: Security scan
        run: pnpm security:scan
      - name: Build
        run: |
          pnpm --filter @ws/shared build
          pnpm --filter @ws/rng-core build
          pnpm --filter @ws/math-engine build
      - name: Lab Drop v2 50M (signed)
        env:
          LAB_SIM_SPINS: '50000000'
        run: pnpm lab:pack:v2
      - name: Verify + formal report
        run: |
          DROP=$(node -e "console.log(require('./lab-output/latest-lab-v2.json').outDir)")
          pnpm lab:verify:drop -- "$DROP"
          pnpm lab:report -- "$DROP"
      - name: Upload lab drop
        uses: actions/upload-artifact@v4
        with:
          name: lab-drop-v2-50m
          path: lab-output/lab-drop-*
          retention-days: 30
