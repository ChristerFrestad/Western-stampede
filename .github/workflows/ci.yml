name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @ws/shared build
      - run: pnpm --filter @ws/math-engine build
      - run: pnpm --filter @ws/math-engine test
      - run: pnpm --filter @ws/rgs-api build
      - run: pnpm --filter @ws/client build
      - run: pnpm math:sim 20000
