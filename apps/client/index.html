<!DOCTYPE html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
 <title>Western Stampede</title>
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link
 href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap"
 rel="stylesheet"
 />
 <style>
 :root {
 --bg: #0c0a08;
 --panel: #1a1410ee;
 --gold: #e8b84a;
 --gold-dim: #a67c2a;
 --sand: #d4b896;
 --danger: #c44b2b;
 --ok: #3d9a6a;
 --text: #f5efe6;
 --muted: #9a8b78;
 }
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 }
 html,
 body {
 height: 100%;
 background: radial-gradient(ellipse at 50% 20%, #2a1f14 0%, var(--bg) 70%);
 color: var(--text);
 font-family: 'Outfit', system-ui, sans-serif;
 overflow: hidden;
 user-select: none;
 }
 #app {
 display: grid;
 grid-template-rows: auto 1fr auto;
 height: 100%;
 max-width: 1200px;
 margin: 0 auto;
 }
 header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: 0.6rem 1rem;
 background: linear-gradient(180deg, #2c2118 0%, transparent 100%);
 }
 header h1 {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.75rem;
 letter-spacing: 0.08em;
 color: var(--gold);
 text-shadow: 0 2px 12px #e8b84a55;
 }
 .badge {
 font-size: 0.7rem;
 padding: 0.2rem 0.5rem;
 border: 1px solid var(--gold-dim);
 border-radius: 999px;
 color: var(--gold);
 text-transform: uppercase;
 letter-spacing: 0.06em;
 }
 #stage-wrap {
 position: relative;
 display: flex;
 align-items: stretch;
 justify-content: center;
 min-height: 0;
 padding: 0;
 flex: 1;
 }
 #game-canvas {
 width: 100%;
 height: 100%;
 max-width: none;
 border-radius: 0;
 box-shadow: none;
 background: #0a0705;
 display: block;
 }
 #hud {
 position: absolute;
 inset: 0;
 pointer-events: none;
 display: flex;
 flex-direction: column;
 justify-content: space-between;
 padding: 0.75rem 1rem;
 width: 100%;
 max-width: none;
 margin: 0;
 }
 #hud .top-row,
 #hud .win-row {
 display: flex;
 justify-content: space-between;
 gap: 1rem;
 pointer-events: none;
 }
 .meter {
 background: linear-gradient(165deg, #241810f2, #120c08f5);
 border: 1px solid #e8b84a66;
 border-radius: 12px;
 padding: 0.5rem 0.95rem;
 min-width: 128px;
 box-shadow: 0 4px 18px #0008, inset 0 1px 0 #e8b84a22;
 }
 .meter label {
 display: block;
 font-size: 0.68rem;
 color: var(--muted);
 text-transform: uppercase;
 letter-spacing: 0.1em;
 font-weight: 600;
 }
 .meter strong {
 font-family: 'Bebas Neue', Impact, sans-serif;
 font-size: 1.55rem;
 color: var(--gold);
 letter-spacing: 0.04em;
 text-shadow: 0 2px 10px #e8b84a44;
 line-height: 1.1;
 }
 .meter.herd {
 display: none;
 min-width: 150px;
 border-color: #e8b84a88;
 background: linear-gradient(145deg, #2a1c10ee, #120c08f0);
 box-shadow: 0 0 0 0 #e8b84a00;
 transition: box-shadow 0.3s, border-color 0.3s;
 }
 .meter.herd.show {
 display: block;
 }
 .meter.herd.pulse {
 animation: herd-meter-pulse 0.9s ease-out;
 border-color: #ffe08a;
 }
 @keyframes herd-meter-pulse {
 0% { box-shadow: 0 0 0 0 #e8b84a88; transform: scale(1); }
 40% { box-shadow: 0 0 24px 4px #e8b84a99; transform: scale(1.04); }
 100% { box-shadow: 0 0 0 0 #e8b84a00; transform: scale(1); }
 }
 .meter.herd .herd-head {
 display: flex;
 align-items: center;
 gap: 0.5rem;
 }
 .meter.herd img {
 width: 36px;
 height: 36px;
 border-radius: 6px;
 object-fit: cover;
 border: 1px solid #e8b84a88;
 }
 .meter.herd .herd-meta {
 flex: 1;
 min-width: 0;
 }
 .meter.herd .herd-on-grid {
 display: block;
 font-size: 0.68rem;
 color: var(--sand);
 margin-top: 0.15rem;
 letter-spacing: 0.04em;
 text-transform: none;
 font-weight: 600;
 }
 #feature-banner {
 align-self: center;
 min-height: 0;
 text-align: center;
 pointer-events: none;
 opacity: 0;
 transition: opacity 0.25s;
 max-width: min(92vw, 520px);
 margin: 0.35rem auto;
 padding: 0.45rem 0.95rem;
 border-radius: 999px;
 border: 1px solid #e8b84a66;
 background: #120c08ee;
 color: #f0d080;
 font-size: 0.8rem;
 letter-spacing: 0.04em;
 font-weight: 600;
 }
 #feature-banner.show {
 opacity: 1;
 }
 #feature-banner.alert {
 border-color: #c44b2baa;
 background: #c44b2bee;
 color: #fff;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.35rem;
 letter-spacing: 0.1em;
 border-radius: 8px;
 }
 footer {
 display: flex;
 flex-wrap: wrap;
 gap: 0.6rem;
 align-items: center;
 justify-content: center;
 padding: 0.75rem 1rem 1.25rem;
 background: linear-gradient(0deg, #1a1410 0%, transparent 100%);
 }
 .ctrl {
 display: flex;
 align-items: center;
 gap: 0.4rem;
 background: var(--panel);
 border: 1px solid #e8b84a33;
 border-radius: 12px;
 padding: 0.4rem 0.6rem;
 }
 button {
 font-family: 'Outfit', sans-serif;
 font-weight: 700;
 border: none;
 cursor: pointer;
 border-radius: 10px;
 padding: 0.65rem 1.1rem;
 transition: transform 0.1s, filter 0.15s;
 }
 button:active:not(:disabled) {
 transform: scale(0.97);
 }
 button:disabled {
 opacity: 0.45;
 cursor: not-allowed;
 }
 .btn-spin {
 background: linear-gradient(180deg, #f0c860, #c4922a);
 color: #1a1008;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.5rem;
 letter-spacing: 0.12em;
 min-width: 140px;
 box-shadow: 0 4px 20px #e8b84a55;
 }
 .btn-secondary {
 background: #2a221a;
 color: var(--sand);
 border: 1px solid #e8b84a44;
 }
 .btn-buy {
 background: linear-gradient(180deg, #5a3a8a, #3a2060);
 color: #f0e8ff;
 border: 1px solid #a080d0;
 }
 .btn-topup {
 background: linear-gradient(180deg, #3d9a6a, #2a6b4a);
 color: #e8fff2;
 }
 select,
 input[type='number'] {
 background: #0c0a08;
 color: var(--text);
 border: 1px solid #e8b84a44;
 border-radius: 8px;
 padding: 0.45rem 0.6rem;
 font-family: inherit;
 }
 #modal-root {
 position: fixed;
 inset: 0;
 background: #000a;
 display: none;
 align-items: center;
 justify-content: center;
 z-index: 50;
 padding: 1rem;
 }
 #modal-root.open {
 display: flex;
 }
 .modal {
 background: #1a1410;
 border: 1px solid var(--gold-dim);
 border-radius: 16px;
 max-width: 480px;
 width: 100%;
 max-height: min(90vh, 720px);
 overflow-y: auto;
 padding: 1.5rem;
 box-shadow: 0 20px 60px #000c;
 backdrop-filter: blur(2px);
 }
 .modal.modal-buy {
 max-width: min(960px, 96vw);
 }
 .buy-lead {
 margin-bottom: 1rem;
 }
 .buy-grid {
 display: grid;
 grid-template-columns: repeat(3, 1fr);
 gap: 0.75rem;
 margin: 0.75rem 0 0.5rem;
 }
 .buy-card {
 position: relative;
 display: flex;
 flex-direction: column;
 gap: 0.35rem;
 text-align: left;
 padding: 1rem 0.9rem 0.9rem;
 border-radius: 14px;
 border: 1px solid #e8b84a44;
 background: linear-gradient(165deg, #2a2018 0%, #120e0a 100%);
 color: var(--text);
 cursor: pointer;
 transition: transform 0.15s, border-color 0.15s, box-shadow 0.15s;
 min-height: 168px;
 }
 .buy-card:hover:not(:disabled),
 .buy-card:focus-visible:not(:disabled) {
 transform: translateY(-3px);
 border-color: var(--gold);
 box-shadow: 0 10px 28px #000a, 0 0 20px #e8b84a33;
 outline: none;
 }
 .buy-card:disabled {
 opacity: 0.4;
 cursor: not-allowed;
 transform: none;
 box-shadow: none;
 }
 .buy-card.recommended {
 border-color: #a080d0;
 background: linear-gradient(165deg, #2e2040 0%, #140e1c 100%);
 }
 .buy-card.premium {
 border-color: #e8b84aaa;
 background: linear-gradient(165deg, #3a2a12 0%, #1a1208 100%);
 box-shadow: 0 0 0 1px #e8b84a33;
 }
 .buy-card .tier-name {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.45rem;
 letter-spacing: 0.08em;
 color: var(--gold);
 }
 .buy-card.recommended .tier-name { color: #d8c0ff; }
 .buy-card .tier-fg {
 font-size: 0.95rem;
 font-weight: 700;
 color: var(--sand);
 }
 .buy-card .tier-price {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.85rem;
 letter-spacing: 0.04em;
 color: #fff8e8;
 margin-top: 0.15rem;
 }
 .buy-card .tier-mult {
 font-size: 0.75rem;
 color: var(--muted);
 letter-spacing: 0.04em;
 }
 .buy-card .tier-perks {
 font-size: 0.78rem;
 color: #c4b8a0;
 line-height: 1.35;
 margin-top: auto;
 padding-top: 0.4rem;
 }
 .buy-badge {
 position: absolute;
 top: 0.45rem;
 right: 0.45rem;
 font-size: 0.62rem;
 font-weight: 700;
 letter-spacing: 0.1em;
 text-transform: uppercase;
 padding: 0.2rem 0.45rem;
 border-radius: 999px;
 background: #5a3a8a;
 color: #f0e8ff;
 border: 1px solid #a080d0;
 }
 .buy-badge.gold {
 background: #a67c2a;
 color: #1a1008;
 border-color: #e8b84a;
 }
 .buy-foot {
 font-size: 0.8rem;
 color: var(--muted);
 margin-top: 0.5rem;
 }
 .chip-locked {
 display: none;
 align-items: center;
 gap: 0.35rem;
 font-size: 0.72rem;
 font-weight: 700;
 letter-spacing: 0.06em;
 text-transform: uppercase;
 color: #f0d080;
 background: #2a1c10ee;
 border: 1px solid #e8b84a66;
 border-radius: 999px;
 padding: 0.35rem 0.75rem;
 }
 .chip-locked.show { display: inline-flex; }
 .fx-skip-hint {
 position: fixed;
 bottom: 1.25rem;
 left: 50%;
 transform: translateX(-50%);
 z-index: 61;
 font-size: 0.72rem;
 letter-spacing: 0.14em;
 text-transform: uppercase;
 color: #9a8b78;
 background: #120c08cc;
 border: 1px solid #e8b84a44;
 padding: 0.35rem 0.85rem;
 border-radius: 999px;
 pointer-events: none;
 }
 button.btn-mute-on {
 border-color: var(--ok);
 color: #8fefb8;
 }
 button.btn-mute-off {
 border-color: var(--danger);
 color: #f0a090;
 }
 .modal h2 {
 font-family: 'Bebas Neue', sans-serif;
 color: var(--gold);
 letter-spacing: 0.06em;
 margin-bottom: 0.75rem;
 }
 .modal p,
 .modal li {
 color: var(--sand);
 font-size: 0.9rem;
 line-height: 1.45;
 }
 .modal ul {
 margin: 0.5rem 0 1rem 1.1rem;
 }
 .modal-actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-top: 1rem;
 }
 #toast {
 position: fixed;
 bottom: 5.5rem;
 left: 50%;
 transform: translateX(-50%);
 background: #1a1410ee;
 border: 1px solid var(--gold);
 color: var(--gold);
 padding: 0.6rem 1.2rem;
 border-radius: 999px;
 opacity: 0;
 transition: opacity 0.25s;
 z-index: 40;
 pointer-events: none;
 font-weight: 600;
 }
 #toast.show {
 opacity: 1;
 }
 /* Feature overlays */
 #fx-layer {
 position: fixed;
 inset: 0;
 z-index: 60;
 display: none;
 align-items: center;
 justify-content: center;
 pointer-events: none;
 }
 #fx-layer.show {
 display: flex;
 }
 .fx-splash {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: radial-gradient(ellipse at center, #0008 0%, #000d 70%);
 animation: fx-fade-in 0.25s ease-out;
 }
 .fx-splash.free {
 background:
 linear-gradient(180deg, #000a, #000c),
 url('/assets/ui/free-games-splash.jpg') center/cover no-repeat;
 }
 .fx-splash.stampede {
 background: radial-gradient(circle at 50% 40%, #5a2a10cc, #000e);
 }
 .fx-splash.wheel {
 background: radial-gradient(circle at 50% 45%, #3a2818ee, #000f);
 }
 .fx-card {
 text-align: center;
 padding: 1.5rem 2rem;
 border-radius: 18px;
 border: 2px solid #e8b84a99;
 background: #120c08ee;
 box-shadow: 0 20px 80px #000c, 0 0 40px #e8b84a33;
 max-width: min(92vw, 560px);
 }
 .fx-card.wheel-card {
 max-width: min(94vw, 420px);
 }
 .fx-kicker {
 font-size: 0.75rem;
 letter-spacing: 0.2em;
 color: #d4b896;
 margin-bottom: 0.4rem;
 }
 .fx-title {
 font-family: 'Bebas Neue', sans-serif;
 font-size: clamp(2rem, 6vw, 3.2rem);
 color: #f0c860;
 letter-spacing: 0.06em;
 text-shadow: 0 4px 20px #e8b84a66;
 }
 .fx-sub {
 margin-top: 0.6rem;
 color: #d4b896;
 font-size: 1rem;
 }
 .fx-explain {
 margin-top: 0.55rem;
 font-size: 0.82rem;
 line-height: 1.35;
 color: #b8a890;
 max-width: 36ch;
 margin-left: auto;
 margin-right: auto;
 }
 .fx-splash.inject {
 background: radial-gradient(circle at 50% 55%, #4a3010cc, #000e);
 }
 .inject-card {
 overflow: hidden;
 position: relative;
 }
 .herd-fly-stage {
 position: relative;
 height: 160px;
 margin-top: 0.75rem;
 pointer-events: none;
 }
 .herd-fly {
 position: absolute;
 top: 0;
 width: 52px;
 height: 52px;
 object-fit: cover;
 border-radius: 10px;
 border: 2px solid #e8b84a;
 box-shadow: 0 4px 16px #000a;
 animation-name: herd-dive;
 animation-timing-function: cubic-bezier(0.2, 0.8, 0.2, 1);
 animation-fill-mode: forwards;
 opacity: 0;
 }
 @keyframes herd-dive {
 0% { transform: translateY(-20px) scale(0.6) rotate(-8deg); opacity: 0; }
 15% { opacity: 1; }
 100% { transform: translateY(120px) scale(0.35) rotate(12deg); opacity: 0.15; }
 }
 .fx-splash.callout {
 background: transparent;
 align-items: flex-start;
 padding-top: 5.5rem;
 }
 .callout-card {
 padding: 0.75rem 1.1rem;
 border-color: #e8b84acc;
 background: #120c08f2;
 box-shadow: 0 8px 32px #000c, 0 0 24px #e8b84a44;
 }
 .callout-row {
 display: flex;
 align-items: center;
 gap: 0.75rem;
 text-align: left;
 }
 .callout-icon {
 width: 48px;
 height: 48px;
 border-radius: 8px;
 object-fit: cover;
 border: 2px solid #e8b84a;
 }
 .callout-title {
 font-size: 1.45rem !important;
 line-height: 1.1;
 }
 .wheel-stage {
 position: relative;
 width: min(72vw, 300px);
 height: min(72vw, 300px);
 margin: 1rem auto 0.5rem;
 }
 .wheel-disc {
 width: 100%;
 height: 100%;
 border-radius: 50%;
 overflow: hidden;
 border: 4px solid #e8b84a;
 box-shadow: 0 0 30px #e8b84a55, inset 0 0 20px #000a;
 position: relative;
 }
 .wheel-disc img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 display: block;
 }
 .wheel-pointer {
 position: absolute;
 top: -8px;
 left: 50%;
 transform: translateX(-50%);
 width: 0;
 height: 0;
 border-left: 12px solid transparent;
 border-right: 12px solid transparent;
 border-top: 22px solid #f0c860;
 z-index: 2;
 filter: drop-shadow(0 2px 4px #000a);
 }
 .wheel-labels {
 position: absolute;
 inset: 0;
 pointer-events: none;
 }
 .wheel-labels span {
 position: absolute;
 left: 50%;
 top: 50%;
 width: 2.2rem;
 margin-left: -1.1rem;
 margin-top: -0.7rem;
 text-align: center;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.05rem;
 color: #fff8d0;
 text-shadow: 0 1px 3px #000;
 transform: rotate(var(--r)) translateY(-112px) rotate(calc(-1 * var(--r)));
 }
 @keyframes fx-fade-in {
 from { opacity: 0; transform: scale(1.03); }
 to { opacity: 1; transform: scale(1); }
 }
 @media (max-width: 900px) {
 .buy-grid { grid-template-columns: 1fr; }
 .buy-card { min-height: 0; }
 }
 @media (max-width: 640px) {
 footer {
 gap: 0.4rem;
 padding: 0.55rem 0.5rem calc(0.65rem + env(safe-area-inset-bottom, 0));
 }
 button { min-height: 44px; padding: 0.55rem 0.75rem; }
 .btn-spin { min-width: 96px; font-size: 1.2rem; min-height: 48px; }
 #hud { padding: 0.45rem 0.5rem; }
 .meter { min-width: 0; padding: 0.35rem 0.55rem; }
 .meter strong { font-size: 1.1rem; }
 .top-row, .win-row { gap: 0.4rem; flex-wrap: wrap; }
 }
 /* Vegas celebration overlay */
 #celebration-root {
 position: fixed;
 inset: 0;
 z-index: 70;
 display: none;
 pointer-events: none;
 }
 #celebration-root.show {
 display: block;
 pointer-events: auto;
 }
 #celebration-root .cele-veil {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: radial-gradient(ellipse at 50% 40%, #3a2010cc 0%, #000e 70%);
 animation: cele-in 0.2s ease-out;
 }
 #celebration-root.flash-big .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #ffd24a55 0%, #5a4010ee 40%, #000e 75%);
 box-shadow: inset 0 0 80px #ffd24a33;
 }
 #celebration-root.flash-mega .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #ff8a3a66 0%, #6a2010ee 40%, #000f 75%);
 box-shadow: inset 0 0 100px #ff6a2033;
 }
 #celebration-root.flash-super .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #c060ff77 0%, #4a1060ee 40%, #000f 75%);
 box-shadow: inset 0 0 120px #a040ff44;
 }
 #celebration-root.flash-total .cele-veil,
 .cele-veil.cele-total {
 background: radial-gradient(ellipse at 50% 40%, #3dff8a44 0%, #1a3a20ee 40%, #000e 75%);
 }
 .cele-card {
 text-align: center;
 padding: 1.5rem 2rem 2rem;
 min-width: min(90vw, 420px);
 border-radius: 20px;
 border: 2px solid #e8b84aaa;
 background: #120c08f2;
 box-shadow: 0 0 60px #e8b84a44, 0 24px 80px #000c;
 }
 .cele-kicker {
 font-size: 0.75rem;
 letter-spacing: 0.22em;
 color: #d4b896;
 margin-bottom: 0.35rem;
 }
 .cele-title {
 font-family: 'Bebas Neue', Impact, sans-serif;
 font-size: clamp(2.4rem, 8vw, 3.8rem);
 letter-spacing: 0.08em;
 line-height: 1;
 text-shadow: 0 4px 24px #e8b84a88;
 }
 .cele-title-count { color: #f0d080; }
 .cele-title-big {
 color: #ffd24a;
 text-shadow: 0 0 24px #ffd24a88, 0 4px 12px #000a;
 animation: cele-title-pop 0.45s cubic-bezier(0.2, 1.4, 0.3, 1);
 }
 .cele-title-mega {
 color: #ff8a3a;
 text-shadow: 0 0 28px #ff8a3aaa, 0 4px 14px #000a;
 animation: cele-title-pop 0.5s cubic-bezier(0.2, 1.4, 0.3, 1);
 }
 .cele-title-super {
 color: #e8a0ff;
 text-shadow: 0 0 36px #c060ffcc, 0 4px 16px #000a;
 animation: cele-title-pop 0.55s cubic-bezier(0.2, 1.4, 0.3, 1);
 }
 .cele-title-total {
 color: #7dffb0;
 text-shadow: 0 4px 28px #3dff8a88;
 animation: cele-title-pop 0.4s ease-out;
 }
 @keyframes cele-title-pop {
 0% { transform: scale(0.6); opacity: 0; }
 60% { transform: scale(1.08); opacity: 1; }
 100% { transform: scale(1); }
 }
 .cele-amount {
 font-family: 'Bebas Neue', Impact, sans-serif;
 font-size: clamp(2.8rem, 10vw, 4.5rem);
 color: #fff8e8;
 margin-top: 0.5rem;
 letter-spacing: 0.04em;
 text-shadow: 0 2px 12px #000;
 }
 .cele-sub {
 margin-top: 0.65rem;
 font-size: 0.9rem;
 letter-spacing: 0.08em;
 color: #c4b8a0;
 }
 .cele-skip {
 margin-top: 1.1rem;
 font-size: 0.72rem;
 letter-spacing: 0.16em;
 color: #9a8b78;
 transition: opacity 0.2s;
 }
 @keyframes cele-in {
 from { opacity: 0; transform: scale(1.04); }
 to { opacity: 1; transform: scale(1); }
 }
 </style>
 </head>
 <body>
 <div id="app">
 <header>
 <h1>Western Stampede</h1>
 <span class="badge" id="demo-badge">Casino demo · Not real money</span>
 <a class="badge" id="admin-link" href="/admin.html" style="text-decoration:none;margin-left:0.35rem;opacity:0.85" title="Ops admin">Admin</a>
 </header>
 <div id="stage-wrap">
 <canvas id="game-canvas"></canvas>
 <div id="hud">
 <div class="top-row">
 <div class="meter">
 <label>Balance</label>
 <strong id="balance">—</strong>
 </div>
 <div class="meter" id="fg-meter" style="display: none">
 <label>Free games</label>
 <strong id="fg-count">0</strong>
 <span class="herd-on-grid" id="fg-total-label"></span>
