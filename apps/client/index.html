<!DOCTYPE html>
<html lang="en">
 <head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
 <title>Western Stampede</title>
 <link rel="preconnect" href="https://fonts.googleapis.com" />
 <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
 <link
 href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Outfit:wght@400;600;700&display=swap"
 rel="stylesheet"
 />
 <style>
 :root {
 --bg: #0c0a08;
 --panel: #1a1410ee;
 --gold: #e8b84a;
 --gold-dim: #a67c2a;
 --sand: #d4b896;
 --danger: #c44b2b;
 --ok: #3d9a6a;
 --text: #f5efe6;
 --muted: #9a8b78;
 }
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
 }
 html,
 body {
 height: 100%;
 background: radial-gradient(ellipse at 50% 20%, #2a1f14 0%, var(--bg) 70%);
 color: var(--text);
 font-family: 'Outfit', system-ui, sans-serif;
 overflow: hidden;
 user-select: none;
 }
 #app {
 display: grid;
 grid-template-rows: auto 1fr auto;
 height: 100%;
 max-width: 1200px;
 margin: 0 auto;
 }
 header {
 display: flex;
 align-items: center;
 justify-content: space-between;
 padding: 0.6rem 1rem;
 background: linear-gradient(180deg, #2c2118 0%, transparent 100%);
 }
 header h1 {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.75rem;
 letter-spacing: 0.08em;
 color: var(--gold);
 text-shadow: 0 2px 12px #e8b84a55;
 }
 .badge {
 font-size: 0.7rem;
 padding: 0.2rem 0.5rem;
 border: 1px solid var(--gold-dim);
 border-radius: 999px;
 color: var(--gold);
 text-transform: uppercase;
 letter-spacing: 0.06em;
 }
 #stage-wrap {
 position: relative;
 display: flex;
 align-items: stretch;
 justify-content: center;
 min-height: 0;
 padding: 0;
 flex: 1;
 }
 #game-canvas {
 width: 100%;
 height: 100%;
 max-width: none;
 border-radius: 0;
 box-shadow: none;
 background: #0a0705;
 display: block;
 }
 #hud {
 position: absolute;
 inset: 0;
 pointer-events: none;
 display: flex;
 flex-direction: column;
 justify-content: space-between;
 padding: 0.75rem 1rem;
 width: 100%;
 max-width: none;
 margin: 0;
 }
 #hud .top-row,
 #hud .win-row {
 display: flex;
 justify-content: space-between;
 gap: 1rem;
 pointer-events: none;
 }
 .meter {
 background: var(--panel);
 border: 1px solid #e8b84a44;
 border-radius: 10px;
 padding: 0.45rem 0.85rem;
 min-width: 120px;
 }
 .meter label {
 display: block;
 font-size: 0.65rem;
 color: var(--muted);
 text-transform: uppercase;
 letter-spacing: 0.08em;
 }
 .meter strong {
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.4rem;
 color: var(--gold);
 }
 #feature-banner {
 align-self: center;
 background: #c44b2bee;
 color: white;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.5rem;
 letter-spacing: 0.1em;
 padding: 0.5rem 1.5rem;
 border-radius: 8px;
 opacity: 0;
 transition: opacity 0.25s;
 pointer-events: none;
 }
 #feature-banner.show {
 opacity: 1;
 }
 footer {
 display: flex;
 flex-wrap: wrap;
 gap: 0.6rem;
 align-items: center;
 justify-content: center;
 padding: 0.75rem 1rem 1.25rem;
 background: linear-gradient(0deg, #1a1410 0%, transparent 100%);
 }
 .ctrl {
 display: flex;
 align-items: center;
 gap: 0.4rem;
 background: var(--panel);
 border: 1px solid #e8b84a33;
 border-radius: 12px;
 padding: 0.4rem 0.6rem;
 }
 button {
 font-family: 'Outfit', sans-serif;
 font-weight: 700;
 border: none;
 cursor: pointer;
 border-radius: 10px;
 padding: 0.65rem 1.1rem;
 transition: transform 0.1s, filter 0.15s;
 }
 button:active:not(:disabled) {
 transform: scale(0.97);
 }
 button:disabled {
 opacity: 0.45;
 cursor: not-allowed;
 }
 .btn-spin {
 background: linear-gradient(180deg, #f0c860, #c4922a);
 color: #1a1008;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.5rem;
 letter-spacing: 0.12em;
 min-width: 140px;
 box-shadow: 0 4px 20px #e8b84a55;
 }
 .btn-secondary {
 background: #2a221a;
 color: var(--sand);
 border: 1px solid #e8b84a44;
 }
 .btn-buy {
 background: linear-gradient(180deg, #5a3a8a, #3a2060);
 color: #f0e8ff;
 border: 1px solid #a080d0;
 }
 .btn-topup {
 background: linear-gradient(180deg, #3d9a6a, #2a6b4a);
 color: #e8fff2;
 }
 select,
 input[type='number'] {
 background: #0c0a08;
 color: var(--text);
 border: 1px solid #e8b84a44;
 border-radius: 8px;
 padding: 0.45rem 0.6rem;
 font-family: inherit;
 }
 #modal-root {
 position: fixed;
 inset: 0;
 background: #000a;
 display: none;
 align-items: center;
 justify-content: center;
 z-index: 50;
 padding: 1rem;
 }
 #modal-root.open {
 display: flex;
 }
 .modal {
 background: #1a1410;
 border: 1px solid var(--gold-dim);
 border-radius: 16px;
 max-width: 480px;
 width: 100%;
 padding: 1.5rem;
 box-shadow: 0 20px 60px #000c;
 }
 .modal h2 {
 font-family: 'Bebas Neue', sans-serif;
 color: var(--gold);
 letter-spacing: 0.06em;
 margin-bottom: 0.75rem;
 }
 .modal p,
 .modal li {
 color: var(--sand);
 font-size: 0.9rem;
 line-height: 1.45;
 }
 .modal ul {
 margin: 0.5rem 0 1rem 1.1rem;
 }
 .modal-actions {
 display: flex;
 flex-wrap: wrap;
 gap: 0.5rem;
 margin-top: 1rem;
 }
 #toast {
 position: fixed;
 bottom: 5.5rem;
 left: 50%;
 transform: translateX(-50%);
 background: #1a1410ee;
 border: 1px solid var(--gold);
 color: var(--gold);
 padding: 0.6rem 1.2rem;
 border-radius: 999px;
 opacity: 0;
 transition: opacity 0.25s;
 z-index: 40;
 pointer-events: none;
 font-weight: 600;
 }
 #toast.show {
 opacity: 1;
 }
 /* Feature overlays */
 #fx-layer {
 position: fixed;
 inset: 0;
 z-index: 60;
 display: none;
 align-items: center;
 justify-content: center;
 pointer-events: none;
 }
 #fx-layer.show {
 display: flex;
 }
 .fx-splash {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: radial-gradient(ellipse at center, #0008 0%, #000d 70%);
 animation: fx-fade-in 0.25s ease-out;
 }
 .fx-splash.free {
 background:
 linear-gradient(180deg, #000a, #000c),
 url('/assets/ui/free-games-splash.jpg') center/cover no-repeat;
 }
 .fx-splash.stampede {
 background: radial-gradient(circle at 50% 40%, #5a2a10cc, #000e);
 }
 .fx-splash.wheel {
 background: radial-gradient(circle at 50% 45%, #3a2818ee, #000f);
 }
 .fx-card {
 text-align: center;
 padding: 1.5rem 2rem;
 border-radius: 18px;
 border: 2px solid #e8b84a99;
 background: #120c08ee;
 box-shadow: 0 20px 80px #000c, 0 0 40px #e8b84a33;
 max-width: min(92vw, 560px);
 }
 .fx-card.wheel-card {
 max-width: min(94vw, 420px);
 }
 .fx-kicker {
 font-size: 0.75rem;
 letter-spacing: 0.2em;
 color: #d4b896;
 margin-bottom: 0.4rem;
 }
 .fx-title {
 font-family: 'Bebas Neue', sans-serif;
 font-size: clamp(2rem, 6vw, 3.2rem);
 color: #f0c860;
 letter-spacing: 0.06em;
 text-shadow: 0 4px 20px #e8b84a66;
 }
 .fx-sub {
 margin-top: 0.6rem;
 color: #d4b896;
 font-size: 1rem;
 }
 .wheel-stage {
 position: relative;
 width: min(72vw, 300px);
 height: min(72vw, 300px);
 margin: 1rem auto 0.5rem;
 }
 .wheel-disc {
 width: 100%;
 height: 100%;
 border-radius: 50%;
 overflow: hidden;
 border: 4px solid #e8b84a;
 box-shadow: 0 0 30px #e8b84a55, inset 0 0 20px #000a;
 position: relative;
 }
 .wheel-disc img {
 width: 100%;
 height: 100%;
 object-fit: cover;
 display: block;
 }
 .wheel-pointer {
 position: absolute;
 top: -8px;
 left: 50%;
 transform: translateX(-50%);
 width: 0;
 height: 0;
 border-left: 12px solid transparent;
 border-right: 12px solid transparent;
 border-top: 22px solid #f0c860;
 z-index: 2;
 filter: drop-shadow(0 2px 4px #000a);
 }
 .wheel-labels {
 position: absolute;
 inset: 0;
 pointer-events: none;
 }
 .wheel-labels span {
 position: absolute;
 left: 50%;
 top: 50%;
 width: 2.2rem;
 margin-left: -1.1rem;
 margin-top: -0.7rem;
 text-align: center;
 font-family: 'Bebas Neue', sans-serif;
 font-size: 1.05rem;
 color: #fff8d0;
 text-shadow: 0 1px 3px #000;
 transform: rotate(var(--r)) translateY(-112px) rotate(calc(-1 * var(--r)));
 }
 @keyframes fx-fade-in {
 from { opacity: 0; transform: scale(1.03); }
 to { opacity: 1; transform: scale(1); }
 }
 @media (max-width: 640px) {
 footer { gap: 0.35rem; padding: 0.5rem; }
 .btn-spin { min-width: 100px; font-size: 1.2rem; }
 }
 /* Vegas celebration overlay */
 #celebration-root {
 position: fixed;
 inset: 0;
 z-index: 70;
 display: none;
 pointer-events: none;
 }
 #celebration-root.show {
 display: block;
 pointer-events: auto;
 }
 #celebration-root .cele-veil {
 width: 100%;
 height: 100%;
 display: flex;
 align-items: center;
 justify-content: center;
 background: radial-gradient(ellipse at 50% 40%, #3a2010cc 0%, #000e 70%);
 animation: cele-in 0.2s ease-out;
 }
 #celebration-root.flash-big .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #5a4010ee 0%, #000e 72%);
 }
 #celebration-root.flash-mega .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #6a2010ee 0%, #000f 72%);
 }
 #celebration-root.flash-super .cele-veil {
 background: radial-gradient(ellipse at 50% 40%, #4a1060ee 0%, #000f 72%);
 }
 .cele-card {
 text-align: center;
 padding: 1.5rem 2rem 2rem;
 min-width: min(90vw, 420px);
 border-radius: 20px;
 border: 2px solid #e8b84aaa;
 background: #120c08f2;
 box-shadow: 0 0 60px #e8b84a44, 0 24px 80px #000c;
 }
 .cele-kicker {
 font-size: 0.75rem;
 letter-spacing: 0.22em;
 color: #d4b896;
 margin-bottom: 0.35rem;
 }
 .cele-title {
 font-family: 'Bebas Neue', Impact, sans-serif;
 font-size: clamp(2.4rem, 8vw, 3.8rem);
 letter-spacing: 0.08em;
 line-height: 1;
 text-shadow: 0 4px 24px #e8b84a88;
 }
 .cele-title-count { color: #f0d080; }
 .cele-title-big { color: #ffd24a; }
 .cele-title-mega { color: #ff8a3a; }
 .cele-title-super { color: #e8a0ff; }
 .cele-amount {
 font-family: 'Bebas Neue', Impact, sans-serif;
 font-size: clamp(2.8rem, 10vw, 4.5rem);
 color: #fff8e8;
 margin-top: 0.5rem;
 letter-spacing: 0.04em;
 text-shadow: 0 2px 12px #000;
 }
 .cele-skip {
 margin-top: 1.1rem;
 font-size: 0.72rem;
 letter-spacing: 0.16em;
 color: #9a8b78;
 transition: opacity 0.2s;
 }
 @keyframes cele-in {
 from { opacity: 0; transform: scale(1.04); }
 to { opacity: 1; transform: scale(1); }
 }
 </style>
 </head>
 <body>
 <div id="app">
 <header>
 <h1>Western Stampede</h1>
 <span class="badge" id="demo-badge">Demo play · Not real money</span>
 </header>
 <div id="stage-wrap">
 <canvas id="game-canvas"></canvas>
 <div id="hud">
 <div class="top-row">
 <div class="meter">
 <label>Balance</label>
 <strong id="balance">—</strong>
 </div>
 <div class="meter" id="fg-meter" style="display: none">
 <label>Free games</label>
 <strong id="fg-count">0</strong>
 </div>
 <div class="meter">
 <label>Last win</label>
 <strong id="last-win">0</strong>
 </div>
 </div>
 <div id="feature-banner"></div>
 <div class="win-row">
 <div class="meter">
 <label>Ways</label>
 <strong id="ways-label">3,456</strong>
 </div>
 <div class="meter">
 <label>Longhorns injected</label>
 <strong id="premium-inj">0</strong>
 </div>
 <div class="meter" id="feature-win" style="display: none">
 <label>Feature win</label>
 <strong id="feature-win-val">0</strong>
 </div>
 </div>
 </div>
 </div>
 <footer>
 <div class="ctrl">
 <label for="bet">Bet</label>
 <select id="bet"></select>
 </div>
 <button class="btn-secondary" id="btn-minus" type="button">−</button>
 <button class="btn-spin" id="btn-spin" type="button">SPIN</button>
 <button class="btn-secondary" id="btn-plus" type="button">+</button>
 <button class="btn-secondary" id="btn-auto" type="button">AUTO</button>
 <button class="btn-buy" id="btn-buy" type="button">BUY BONUS</button>
 <button class="btn-topup" id="btn-topup" type="button">TOP UP</button>
 <button class="btn-secondary" id="btn-rules" type="button">RULES</button>
 <button class="btn-secondary" id="btn-mute" type="button">SOUND</button>
 </footer>
 </div>
 <div id="toast"></div>
 <div id="modal-root"></div>
 <script type="module" src="/src/main.ts"></script>
 </body>
</html>
